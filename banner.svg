<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Градиент фона -->
    <radialGradient id="bgGlow" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1f2438"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d12"/>
    </radialGradient>

    <!-- Акцентный градиент для заголовка -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Градиент линий набора -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="1280" height="640" fill="url(#bgGlow)"/>

  <!-- Декоративная типографская сетка (направляющие поля) -->
  <g stroke="#30363d" stroke-width="1" opacity="0.35">
    <line x1="80" y1="80" x2="80" y2="560" stroke-dasharray="4,4"/>
    <line x1="1200" y1="80" x2="1200" y2="560" stroke-dasharray="4,4"/>
    <line x1="50" y1="100" x2="1230" y2="100"/>
    <line x1="50" y1="540" x2="1230" y2="540"/>
  </g>

  <!-- Правая колонка: Визуализация полосы набора текста (Knuth-Plass) -->
  <g transform="translate(800, 160)" opacity="0.9">
    <rect x="0" y="0" width="360" height="12" rx="4" fill="url(#lineGrad)"/>
    <rect x="0" y="24" width="360" height="12" rx="4" fill="#334155"/>
    <rect x="0" y="48" width="360" height="12" rx="4" fill="#334155"/>
    <rect x="0" y="72" width="360" height="12" rx="4" fill="url(#lineGrad)"/>
    <rect x="0" y="96" width="360" height="12" rx="4" fill="#334155"/>
    <rect x="0" y="120" width="240" height="12" rx="4" fill="#64748b"/>

    <!-- Разделитель -->
    <line x1="0" y1="160" x2="360" y2="160" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Второй блок со знаком абзаца -->
    <text x="-45" y="214" fill="#a78bfa" font-family="Georgia, serif" font-size="34" font-style="italic">¶</text>
    <rect x="0" y="190" width="360" height="12" rx="4" fill="#334155"/>
    <rect x="0" y="214" width="360" height="12" rx="4" fill="url(#lineGrad)"/>
    <rect x="0" y="238" width="360" height="12" rx="4" fill="#334155"/>
    <rect x="0" y="262" width="200" height="12" rx="4" fill="#64748b"/>
  </g>

  <!-- Левая колонка: Заголовки, бейдж и плашки -->
  <g transform="translate(120, 170)">
    <!-- Верхний бейдж (расширен до 260px, текст центрирован через text-anchor="middle") -->
    <g>
      <rect x="0" y="0" width="260" height="34" rx="17" fill="#1e293b" stroke="#334155"/>
      <text x="130" y="22" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
        ⚡ MODEL CONTEXT PROTOCOL
      </text>
    </g>

    <!-- Главный заголовок -->
    <text x="0" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      Typography Audit
    </text>
    <text x="0" y="155" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">
      MCP Server
    </text>

    <!-- Подзаголовок -->
    <text x="0" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
      TeX-grade Knuth–Plass line breaking &amp; visual QA for AI agents
    </text>

    <!-- Нижние теги: каждая плашка в своей группе со смещением и центрированным текстом -->
    <g transform="translate(0, 260)">
      <!-- Тег 1: Justif -->
      <g transform="translate(0, 0)">
        <rect width="90" height="34" rx="8" fill="#1e293b" stroke="#475569"/>
        <text x="45" y="22" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Justif</text>
      </g>

      <!-- Тег 2: Playwright -->
      <g transform="translate(104, 0)">
        <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#475569"/>
        <text x="62.5" y="22" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Playwright</text>
      </g>

      <!-- Тег 3: TypeScript -->
      <g transform="translate(243, 0)">
        <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#475569"/>
        <text x="62.5" y="22" text-anchor="middle" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">TypeScript</text>
      </g>
    </g>
  </g>
</svg>